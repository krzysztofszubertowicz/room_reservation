# Pelny stos aplikacji "room reservation":
#   db         - Microsoft SQL Server (baza danych)
#   backend    - FastAPI (API) + sterownik ODBC 18
#   frontend   - Next.js (interfejs uzytkownika)
#   prometheus - zbieranie metryk z backendu
#   grafana    - wizualizacja metryk
#
# Uruchomienie:  docker compose up --build
# Konfiguracja:  skopiuj .env.example do .env i uzupelnij wartosci

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: room_db
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${DB_PASSWORD}
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - mssql_data:/var/opt/mssql
      # Backup bazy (tylko do odczytu) - uzywany przy pierwszym starcie do odtworzenia danych.
      - ./sanspace.bak:/var/opt/mssql/backup/sanspace.bak:ro
    healthcheck:
      # Baza jest "zdrowa" dopiero gdy odpowiada na zapytania SQL.
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q \"SELECT 1\" || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  backend:
    build: ./backend
    container_name: room_backend
    environment:
      DB_SERVER: db
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      # Sciezka backupu widziana przez kontener bazy (patrz wolumen w usludze "db").
      # Przy pierwszym starcie baza zostanie odtworzona z tego pliku.
      BACKUP_FILE: /var/opt/mssql/backup/sanspace.bak
      SECRET_KEY: ${SECRET_KEY}
      ALGORITHM: ${ALGORITHM}
      SMTP_SERVER: ${SMTP_SERVER}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
    ports:
      - "8000:8000"
    depends_on:
      db:
        # Backend startuje dopiero gdy baza przejdzie healthcheck.
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: room_frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend

  prometheus:
    image: prom/prometheus
    container_name: room_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    depends_on:
      - backend

  grafana:
    image: grafana/grafana
    container_name: room_grafana
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  mssql_data:
  grafana_data:
